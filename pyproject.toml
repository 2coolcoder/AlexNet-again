[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alexnet-again"
version = "0.1.0"
description = "AlexNet (2012) re-implemented in PyTorch with a modern training recipe and 2-GPU parallelism"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
